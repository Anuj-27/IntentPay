<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IntentPay AI — describe what you want to buy and IntentPay finds catalog-grounded options behind a deterministic Trust Gate.">
  <meta name="theme-color" content="#071510">
  <title>IntentPay AI — From intent to trusted payment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e1d17'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='24' font-weight='700' fill='%233fdb95' text-anchor='middle'%3EIP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/chat.css">
  <link rel="stylesheet" href="/assets/assistant.css">
</head>
<body class="ip-body">

  <div class="ip-backdrop" aria-hidden="true">
    <div class="ip-grid"></div>
    <div class="ip-glow ip-glow-a"></div>
    <div class="ip-glow ip-glow-b"></div>
    <span class="ip-particle p1"></span>
    <span class="ip-particle p2"></span>
    <span class="ip-particle p3"></span>
  </div>

  <header class="ip-topbar">
    <a class="ip-brand" href="/" aria-label="IntentPay home"><span class="ip-brand-mark">IP</span><span>IntentPay</span></a>
    <nav class="ip-topnav" aria-label="IntentPay">
      <a href="/">Home</a>
      <a href="/catalog">Catalog</a>
      <a href="/merchant">Merchant login</a>
    </nav>
  </header>

  <main class="ip-stage" id="assistantRoot" aria-label="IntentPay AI assistant"></main>

  <script src="/assets/site.js" defer></script>
  <script src="/assets/razorpay_checkout.js" defer></script>
  <script src="/assets/assistant.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      IntentPayAssistant.mount(document.querySelector("#assistantRoot"), { variant: "fullscreen" });
    });
  </script>
</body>
</html>
